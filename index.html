<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3FA8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
<title>복권 수첩</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="복권수첩">
<style>
:root {
  color-scheme: light;
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #F7F8FB;
  --ink: #141A26;
  --ink-2: #444E63;
  --muted: #6B7488;
  --line: #DCE1EA;
  --accent: #1F3FA8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EBFA;
  --good: #0B8A3E;
  --good-soft: #E3F4E9;
  --warn: #9A5B00;
  --warn-soft: #FDF1DA;
  --bad: #C0362F;
  --bad-soft: #FBE6E4;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --grid: #E6E9EF;
  --ball-y: #FBC400; --ball-b: #69C8F2; --ball-r: #FF7272; --ball-g: #AAAAAA; --ball-l: #B0D840;
  --shadow: 0 1px 2px rgba(20, 26, 38, .06), 0 4px 16px rgba(20, 26, 38, .05);
  --radius: 14px;
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "D2Coding", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E131C; --surface: #161D29; --surface-2: #1B2331; --ink: #E8ECF4; --ink-2: #C3CAD8; --muted: #8F99AD;
    --line: #283244; --accent: #7EA0FF; --accent-ink: #0E131C; --accent-soft: #1E2944;
    --good: #45C278; --good-soft: #15291E; --warn: #F0B54A; --warn-soft: #2E2413; --bad: #F07B72; --bad-soft: #321A19;
    --series-1: #3987e5; --series-2: #d95926; --grid: #232C3B;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E131C; --surface: #161D29; --surface-2: #1B2331; --ink: #E8ECF4; --ink-2: #C3CAD8; --muted: #8F99AD;
  --line: #283244; --accent: #7EA0FF; --accent-ink: #0E131C; --accent-soft: #1E2944;
  --good: #45C278; --good-soft: #15291E; --warn: #F0B54A; --warn-soft: #2E2413; --bad: #F07B72; --bad-soft: #321A19;
  --series-1: #3987e5; --series-2: #d95926; --grid: #232C3B;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }

/* ── 상단 바 ── */
.top {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; border-bottom: 1px solid var(--line);
}
.top-row { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand img { width: 26px; height: 26px; border-radius: 7px; }
.sync { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; line-height: 1.3; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn svg { width: 18px; height: 18px; stroke: var(--ink-2); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:focus-visible, .btn:focus-visible, .tab:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin svg { animation: none; } }

.demo-bar {
  background: var(--warn-soft); color: var(--warn); font-size: 13px; font-weight: 600; text-align: center;
  padding: 7px 16px; border-bottom: 1px solid var(--line);
}

/* ── 본문 ── */
main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 96px); display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.card h2 { margin: 0 0 10px; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.card h2 small { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 6px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.muted { color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

/* 이번 주 상태 */
.status { border-left-width: 5px; }
.status[data-kind="done"] { border-left-color: var(--good); }
.status[data-kind="charge"], .status[data-kind="pending"] { border-left-color: var(--warn); }
.status[data-kind="gave_up"], .status[data-kind="blocked"] { border-left-color: var(--bad); }
.status-head { display: flex; align-items: center; gap: 10px; margin: 4px 0 8px; }
.status-icon { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.status-icon svg { width: 17px; height: 17px; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.status[data-kind="done"] .status-icon { background: var(--good-soft); } .status[data-kind="done"] .status-icon svg { stroke: var(--good); }
.status[data-kind="charge"] .status-icon, .status[data-kind="pending"] .status-icon { background: var(--warn-soft); }
.status[data-kind="charge"] .status-icon svg, .status[data-kind="pending"] .status-icon svg { stroke: var(--warn); }
.status[data-kind="gave_up"] .status-icon, .status[data-kind="blocked"] .status-icon { background: var(--bad-soft); }
.status[data-kind="gave_up"] .status-icon svg, .status[data-kind="blocked"] .status-icon svg { stroke: var(--bad); }
.status-title { font-size: 18px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.status ul { margin: 0; padding-left: 18px; color: var(--ink-2); display: grid; gap: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 10px 14px;
  font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.grow { flex: 1 1 auto; justify-content: center; }
.btn:disabled { opacity: .5; cursor: default; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.tile .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.tile .v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.tile .s { font-size: 12px; color: var(--muted); }
.v.up { color: var(--good); } .v.down { color: var(--bad); }

/* 공 */
.balls { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.ball {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px;
  color: #fff; background: var(--ball, var(--muted)); text-shadow: 0 1px 1px rgba(0, 0, 0, .25); font-variant-numeric: tabular-nums;
}
.digit { width: 26px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.jo { font-weight: 700; font-size: 13px; padding: 4px 8px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); margin-right: 4px; }
.ticket { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; }
.ticket + .ticket { border-top: 1px dashed var(--line); }
.ticket.wide { grid-template-columns: 1fr auto; }
.ticket.wide .balls { flex-wrap: nowrap; }
.slot { font-weight: 700; color: var(--muted); font-size: 13px; }

/* 목록 */
.list { display: grid; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center; }
.row:first-child { border-top: 0; }
.row .t { font-weight: 600; }
.row .d { font-size: 13px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.mute { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.row.tap { cursor: pointer; grid-template-columns: 1fr auto 12px; }
.row.tap::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); }
.row.tap:active { background: var(--surface-2); }
.tap-block { cursor: pointer; border-radius: 10px; }
.tap-block:active { background: var(--surface-2); }

/* 상세 */
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h3 { flex: 1; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; }
.facts div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.facts dt { font-size: 12px; color: var(--muted); font-weight: 600; }
.facts dd { margin: 2px 0 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.sec-title { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .03em; margin: 2px 0 6px; }
.win-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.plus { font-weight: 700; color: var(--muted); margin: 0 2px; }
.ball.miss { background: transparent; color: var(--muted); border: 1.5px solid var(--line); text-shadow: none; }
.ball.bonus-hit { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.digit.hit { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.line { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.line:first-of-type { border-top: 0; }
.line .mode { font-size: 11px; color: var(--muted); display: block; }
.month-head { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; padding: 14px 0 4px; display: flex; justify-content: space-between; }

.notice { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.notice:first-child { border-top: 0; }
.notice .h { display: flex; gap: 8px; align-items: baseline; }
.notice .h b { font-size: 15px; }
.notice .when { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.notice p { margin: 0; white-space: pre-line; color: var(--ink-2); font-size: 14px; }
.notice .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; align-self: center; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* 차트 */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); margin: 2px 0 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.legend i.sq { height: 10px; width: 10px; border-radius: 3px; }
.tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.45;
  padding: 7px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); z-index: 2;
}
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 600; border-top: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }

/* 로그 */
.log {
  font: 12px/1.55 var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px; max-height: 62vh; overflow: auto; white-space: pre-wrap; word-break: break-all;
}
.log .e { color: var(--bad); font-weight: 700; } .log .w { color: var(--warn); } .log .n { color: var(--accent); }
.log-tools { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 10px; }
input[type="search"], input[type="text"], input[type="password"], select {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 42px;
}

/* 하단 탭 */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 8px calc(env(safe-area-inset-bottom, 0px) + 6px);
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.bell { position: relative; }
.bell .badge { top: -5px; left: auto; right: -5px; }

/* 설정 · 하위 화면 */
.sub-head { display: flex; align-items: center; gap: 10px; }
.sub-head h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
.sub-head .icon-btn svg { stroke-width: 2.4; }
.admin-badge { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 999px; vertical-align: middle; }
.card.admin { border-style: dashed; }
.menu { display: grid; }
.menu-row {
  appearance: none; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 0; width: 100%;
  display: grid; grid-template-columns: 1fr 12px; gap: 10px; align-items: center; text-align: left; cursor: pointer;
}
.menu-row:first-child { border-top: 0; }
.menu-row b { display: block; font-weight: 600; }
.menu-row small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.menu-row .chev { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); }
.menu-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.row > .d { text-align: right; }
.tab { background: none; border: 0; padding: 6px 0 4px; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; position: relative; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--accent); }
.badge { position: absolute; top: 2px; left: calc(50% + 6px); background: var(--bad); color: #fff; font-size: 10px; min-width: 16px; height: 16px; border-radius: 8px; display: grid; place-items: center; padding: 0 4px; }

/* 연결/잠금 화면, 시트 */
.gate { max-width: 460px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 16px; }
.gate h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.hint { font-size: 12px; color: var(--muted); }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-2); font-size: 14px; }
.err { color: var(--bad); font-size: 13px; font-weight: 600; }
.sheet-bg { position: fixed; inset: 0; background: rgba(10, 14, 22, .45); z-index: 20; display: grid; align-items: end; }
.sheet { background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 18px); max-width: 560px; width: 100%; margin: 0 auto; display: grid; gap: 14px; max-height: 88vh; overflow: auto; }
.sheet h3 { margin: 0; font-size: 17px; }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%); z-index: 30;
  background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px);
}
.pin { letter-spacing: .5em; text-align: center; font-size: 22px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="demo-bar" class="demo-bar" hidden>데모 · 모든 숫자는 예시 데이터입니다</div>

<header class="top" id="top" hidden>
  <div class="top-row">
    <div class="brand"><img src="icon-192.png" alt=""><span>복권 수첩</span></div>
    <div class="sync" id="sync"></div>
    <button class="icon-btn" id="btn-refresh" aria-label="새로고침">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="icon-btn bell" id="btn-bell" aria-label="알림">
      <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
      <span class="badge" id="badge" hidden></span>
    </button>
  </div>
</header>

<main id="view" hidden></main>
<div id="gate" hidden></div>

<nav class="tabs" id="tabs" hidden>
  <div class="in" role="tablist">
    <button class="tab" role="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button class="tab" role="tab" data-tab="history"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>내역</button>
    <button class="tab" role="tab" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>통계</button>
    <button class="tab" role="tab" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>설정</button>
  </div>
</nav>

<script src="app.js"></script>
</body>
</html>
